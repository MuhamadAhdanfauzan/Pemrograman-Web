<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Produk - Toko Buah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h1>Toko Buah</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="add-product.html">Tambah Produk</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section id="add-product">
      <div class="container">
        <h2>Tambah Produk Baru</h2>
        <form id="add-product-form" enctype="multipart/form-data">
          <div>
            <label for="product-name">Nama Produk:</label>
            <input type="text" id="product-name" name="product_name" required>
          </div>
          
          <div>
            <label for="product-price">Harga Produk (Rp):</label>
            <input type="number" id="product-price" name="price" required>
          </div>

          <div>
            <label for="product-image">Gambar Produk:</label>
            <input type="file" id="product-image" name="image" accept="image/*" required>
          </div>

          <button type="submit">Tambah Produk</button>
        </form>
        <div id="response-message"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2024 Toko Buah. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
